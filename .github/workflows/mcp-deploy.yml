name: Deploy MCP Worker

# D1 migrations belong to the Pages app; this workflow never applies them.
on:
  push:
    branches: [main, 'release/cycle-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'mcp-production' || 'mcp-preview' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://mcp.humboldt.inkythesquid.dev' || 'https://cookbook-mcp-preview.gwyn-29d.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck the Worker
        run: bun run mcp:typecheck

      - name: Run tests
        run: bun run test

      # `--env=` (empty) selects the top-level production config. Both branches of the
      # expression must be non-empty: GitHub treats '' as false and would fall through.
      - name: Deploy
        run: bunx wrangler deploy -c mcp/wrangler.jsonc ${{ github.ref == 'refs/heads/main' && '--env=' || '--env=preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
